<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Création Graphique & Identité Visuelle | Portfolio Malo Etchegoyen
    </title>
    <meta
      name="description"
      content="Découvrez les créations graphiques de Malo Etchegoyen : logos, chartes graphiques, illustrations et visuels pour le web."
    />

    <link
      rel="canonical"
      href="[https://maloetchegoyen.github.io/Portfolio/graphique.html](https://maloetchegoyen.github.io/Portfolio/graphique.html)"
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="robots" content="index, follow" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="script.js" defer></script>
    <link rel="icon" type="image/png" href="./asset/avatar.png" />
  </head>
  <body>
    <select id="langSwitcher" class="langSwitcher">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

    <input type="checkbox" id="themeToggle" class="hidden-checkbox" />
    <div class="bg-layer bg-dark"></div>
    <div class="bg-layer bg-light"></div>
    <label
      for="themeToggle"
      class="toggle-button"
      id="theme-icon-container"
    ></label>

    <span id="cursorFollower" class="cursorFollower"></span>
    <section class="content">
      <div class="seo-fallback">
        <h1>Création Graphique et Design Visuel</h1>
        <p>
          Portfolio des projets graphiques de Malo Etchegoyen (BUT MMI).
          Illustrations, retouches et identités visuelles réalisées sur
          Photoshop et Illustrator.
        </p>
      </div>
      <a href="https://maloetchegoyen.github.io/Portfolio/"
        >Retour à la page d'accueil du portfolio</a
      >
    </section>
    <script type="module">
      import { Bento } from "./components/bento/script.js";
      import { GraphicTranslations } from "./data/graphicData.js";

      const langSwitcher = document.getElementById("langSwitcher");
      const contentSection = document.querySelector(".content");

      function setLanguage(lang) {
        document.documentElement.lang = lang;
        localStorage.setItem("lang", lang);

        contentSection.innerHTML = "";
        Bento.render(".content", GraphicTranslations);
      }

      const savedLang = localStorage.getItem("lang") || "fr";
      langSwitcher.value = savedLang;
      setLanguage(savedLang);

      langSwitcher.addEventListener("change", (event) => {
        setLanguage(event.target.value);
      });
    </script>
  </body>
</html>
