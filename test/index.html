<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Cercle</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <!-- Les inputs doivent être frères de .container et placés avant lui -->
    <input type="checkbox" id="containerToggle">
    <input type="checkbox" id="textToggle">
    
    <div class="container">
        <div class="main">
            <label for="containerToggle" class="center">
                <img class="center__eyes" src="../asset/logo/eyes.png" alt="">
            </label>
            <ul>
                <li class="item item-1">
                <label for="textToggle">
                    <h1>Qui je suis</h1>
                </label> 
                </li>  
                <li class="item item-2">
                <label for="textToggle">
                    <h1>Mes compétences</h1>
                </label>
                </li> 
                <li class="item item-3">
                <label for="textToggle">
                    <h1>Mon CV</h1>
                </label>
                </li>
            </ul>
        </div>
        <div class="desc">
            <h1 class="desc__title">test</h1>
            <p class="desc__text">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Deleniti reprehenderit ad repellat nulla laborum, explicabo corporis, nisi voluptatibus obcaecati itaque cum mollitia est beatae ducimus illum odio? Ut, odit saepe?</p>
        </div>
    </div>
</body>
</html>
