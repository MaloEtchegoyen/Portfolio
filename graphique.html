<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malo Etchegoyen : Création graphique</title>
    <link rel="stylesheet" href="css/global.css" />
    <script src="script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="./asset/avatar.png">
  </head>
<body>

      <select id="langSwitcher" class="langSwitcher">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="es">Español</option>
      </select>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

      <input type="checkbox" id="themeToggle" class="hidden-checkbox">
      <div class="bg-layer bg-dark"></div>
      <div class="bg-layer bg-light"></div>
      <label for="themeToggle" class="toggle-button" id="theme-icon-container"></label>
      

    <span id="cursorFollower" class="cursorFollower"></span>
    <section class="content"></section>
    <script type="module">
        import { Bento } from "./components/bento/script.js";
        import { GraphicTranslations } from "./data/graphicData.js";

        const langSwitcher = document.getElementById("langSwitcher");
        const contentSection = document.querySelector(".content");

        function setLanguage(lang) {
            document.documentElement.lang = lang;
            localStorage.setItem("lang", lang);
            
            contentSection.innerHTML = "";
            Bento.render(".content", GraphicTranslations);
        }

        const savedLang = localStorage.getItem("lang") || "fr";
        langSwitcher.value = savedLang;
        setLanguage(savedLang);

        langSwitcher.addEventListener("change", (event) => {
            setLanguage(event.target.value);
        });
    </script>
</body>
</html>
