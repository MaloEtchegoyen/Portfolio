<!doctype html>
<html lang="fr">
  <head>
    <title>Malo Etchegoyen | Portfolio Webdesign, Dév Web & Création Numérique (BUT MMI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de Malo Etchegoyen, étudiant en BUT MMI en design web, développement front/back, motion design et outils Adobe (Photoshop, Illustrator, After Effects).">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://maloetchegoyen.github.io/Portfolio/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://maloetchegoyen.github.io/Portfolio/">
    <meta property="og:title" content="Malo Etchegoyen | Webdesign & Dev Web">
    <meta property="og:description" content="Découvrez les projets web (front/back) et créations numériques (After Effects, Photoshop, Illustrator) de Malo Etchegoyen.">
    <meta property="og:image" content="https://maloetchegoyen.github.io/Portfolio/asset/preview.jpg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://maloetchegoyen.github.io/Portfolio/">
    <meta name="twitter:title" content="Malo Etchegoyen | Webdesign & Dév Web (BUT MMI)">
    <meta name="twitter:description" content="Portfolio de projets web et créations numériques.">
    <meta name="twitter:image" content="https://maloetchegoyen.github.io/Portfolio/asset/preview.jpg">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:locale:alternate" content="en_US">
    <meta property="og:locale:alternate" content="es_ES">

    <link rel="stylesheet" href="css/global.css" />
    <script src="script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="./asset/avatar.png">
  </head>
  <body class="no-scroll">
    <main>
      <div id="preloader">
      <video id="animVideo" autoplay muted playsinline aria-hidden="true">
          <source src="asset/avatar.mp4" type="video/mp4; codecs=hvc1">
          <source src="asset/avatar.webm" type="video/webm">
      </video>
      </div>

    <select id="langSwitcher" class="langSwitcher">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="es">Español</option>
      </select>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

      <input type="checkbox" id="themeToggle" class="hidden-checkbox">
      <div class="bg-layer bg-dark"></div>
      <div class="bg-layer bg-light"></div>
      <label for="themeToggle" class="toggle-button" id="theme-icon-container"></label>
      
      <span id="cursorFollower" class="cursorFollower"></span>
      <section class="hero-section"></section>
      <section class="carousel-section" id="carousel-section"></section>
      <section class="list-section"></section>
      <section class="video-section"></section>
      <section class="about-section"></section>
      <footer class="footer-section"></footer>
    </main>
    <script type="module">
        import { Cards } from "./components/carrousel/script.js";
        import { GraphicTranslations } from "./data/graphicData.js";

        import { Hero } from "./components/hero/script.js";
        import { HeroData } from "./data/heroData.js";
        Hero.render(".hero-section", HeroData);


        import { LI } from "./components/liste/script.js";
        import { WebTranslations } from "./data/webData.js";

        import { Video } from "./components/video/script.js";
        import { VideoTranslations } from "./data/videoData.js";
        
        import { about } from "./components/about/script.js";
        import { AboutData } from "./data/aboutData.js";

        import { Footer } from "./components/footer/script.js";
        import { FooterData } from "./data/footerData.js";
        Footer.render(".footer-section", FooterData);

const langSwitcher = document.getElementById("langSwitcher");
        let currentLang = localStorage.getItem("lang") || "fr";
        langSwitcher.value = currentLang;

        function renderContent(lang) {
            document.documentElement.lang = lang;
            document.querySelector(".carousel-section").innerHTML = "";
            Cards.render(".carousel-section", GraphicTranslations[lang]);

            document.querySelector(".list-section").innerHTML = "";
            LI.render(".list-section", WebTranslations[lang]);

            document.querySelector(".video-section").innerHTML = "";
            Video.render(".video-section", VideoTranslations[lang]);

            about.render(".about-section", AboutData);
        }

        renderContent(currentLang);
        langSwitcher.addEventListener("change", (e) => {
            currentLang = e.target.value;
            localStorage.setItem("lang", currentLang);
            renderContent(currentLang);
        });
    </script>
  </body>
</html>
